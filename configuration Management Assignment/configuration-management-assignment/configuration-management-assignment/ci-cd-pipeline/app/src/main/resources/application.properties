server.port=8080

# These are overridden at container start via APP_COLOR and APP_VERSION env vars
app.color=${APP_COLOR:unknown}
app.version=${APP_VERSION:unknown}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Identify ourselves cleanly in logs
spring.application.name=bluegreen-app
