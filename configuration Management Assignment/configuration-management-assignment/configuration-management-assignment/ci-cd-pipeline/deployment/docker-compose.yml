version: "3.8"

# ============================================================
# Blue-Green Deployment Stack
# ============================================================
# Both blue and green app containers are ALWAYS running.
# Only one is receiving traffic at a time, decided by which
# upstream host nginx is configured to forward to.
#
# Switching is done by:
#   1. Updating nginx/nginx.conf to point to the new color
#   2. Sending nginx a graceful reload (SIGHUP)
# ============================================================

services:

  app-blue:
    image: ${IMAGE_NAME:-bluegreen-app}:${BLUE_TAG:-1.0.0}
    container_name: app-blue
    environment:
      - APP_COLOR=blue
      - APP_VERSION=${BLUE_TAG:-1.0.0}
    expose:
      - "8080"        # internal only — not published to the host
    ports:
      - "8081:8080"   # direct access for health checks during deploys
    networks:
      - bluegreen-net
    restart: unless-stopped

  app-green:
    image: ${IMAGE_NAME:-bluegreen-app}:${GREEN_TAG:-1.0.0}
    container_name: app-green
    environment:
      - APP_COLOR=green
      - APP_VERSION=${GREEN_TAG:-1.0.0}
    expose:
      - "8080"
    ports:
      - "8082:8080"   # direct access for health checks during deploys
    networks:
      - bluegreen-net
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: bluegreen-nginx
    ports:
      - "80:80"       # the ONLY public port — all client traffic comes here
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-blue
      - app-green
    networks:
      - bluegreen-net
    restart: unless-stopped

networks:
  bluegreen-net:
    driver: bridge
