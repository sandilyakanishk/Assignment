worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ============================================================
    # Active upstream — managed by deployment/scripts/switch.sh
    # The line marked ACTIVE_BACKEND below is what gets rewritten
    # by the deployment script to switch traffic between colors.
    # ============================================================
    upstream backend {
        server app-blue:8080;  # ACTIVE_BACKEND
    }

    # Connection tuning — graceful behavior under load
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # Don't expose nginx version
    server_tokens off;

    # Access log helpful for auditing the switchover
    log_format bg '$remote_addr - $remote_user [$time_local] '
                 '"$request" $status $body_bytes_sent '
                 '"$http_referer" "$http_user_agent" '
                 'upstream=$upstream_addr rt=$request_time';
    access_log /var/log/nginx/access.log bg;

    server {
        listen 80 default_server;
        server_name _;

        location /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Hand existing in-flight requests cleanly to the new upstream
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
