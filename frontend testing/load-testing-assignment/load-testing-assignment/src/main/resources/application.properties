server.port=8080

spring.datasource.url=jdbc:h2:mem:loadtest;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Expose actuator endpoints — useful for observing the app DURING load tests
management.endpoints.web.exposure.include=health,metrics,info,httptrace
management.endpoint.health.show-details=always

# Tomcat thread pool — INTENTIONALLY small so we can observe saturation
# with the /api/slow endpoint at moderate concurrency.
# (Default is 200; cutting to 50 makes the bottleneck demonstrable.)
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=10

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=10
