# ============================================================
# Ansible Inventory File
# File: inventory.ini
# Author: Kanishk Sandilya
# ============================================================
# This file tells Ansible which servers to manage.
# Replace the IPs below with your actual server IPs.

[webservers]
web01 ansible_host=192.168.1.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa
web02 ansible_host=192.168.1.11 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

# ---- Group-level variables (apply to all webservers) ----
[webservers:vars]
ansible_python_interpreter=/usr/bin/python3

