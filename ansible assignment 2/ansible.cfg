# ============================================================
# Ansible Configuration File
# File: ansible.cfg
# Author: Kanishk Sandilya
# ============================================================

[defaults]
inventory       = inventory.ini     # Default inventory file
remote_user     = ubuntu            # SSH user on target machines
host_key_checking = False           # Skip SSH key verification (useful for labs)
retry_files_enabled = False         # Don't create .retry files on failure

[privilege_escalation]
become       = True                 # Use sudo by default
become_method = sudo
become_user  = root
