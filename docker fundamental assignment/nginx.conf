# =============================================================
#  nginx/nginx.conf  —  Reverse Proxy Config
#  Author  : Kanishk Sandilya
#
#  Routes:
#    /api/*   → Flask backend  (container: ks_backend:5000)
#    /*       → React frontend (container: ks_frontend:3000)
#
#  Key concepts demonstrated:
#    - upstream blocks (service discovery by container name)
#    - proxy_pass (forward requests to backend containers)
#    - location blocks (URL-based routing)
#    - WebSocket support (for React hot-reload)
# =============================================================

# ── Upstream: Flask backend ───────────────────────────────────
# Docker Compose DNS resolves "backend" to the backend container IP
upstream flask_backend {
    server backend:5000;
}

# ── Upstream: React frontend ──────────────────────────────────
upstream react_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name localhost;

    # ── Health check endpoint for Docker ─────────────────────
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ── Route /api/* → Flask backend ─────────────────────────
    location /api/ {
        proxy_pass         http://flask_backend/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Route /* → React frontend ────────────────────────────
    location / {
        proxy_pass         http://react_frontend;
        proxy_http_version 1.1;

        # WebSocket headers (needed for React hot-module reload)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }

    # ── Security headers ──────────────────────────────────────
    add_header X-Frame-Options        SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection       "1; mode=block";

    # ── Gzip compression ──────────────────────────────────────
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript;
    gzip_min_length 1024;
}
