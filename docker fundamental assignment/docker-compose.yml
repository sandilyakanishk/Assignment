# =============================================================
#  docker-compose.yml  —  Full-Stack Multi-Container App
#  Author  : Kanishk Sandilya
#  Stack   : React frontend · Flask API · PostgreSQL · Redis
#            · Nginx reverse-proxy
#  Usage   :
#    docker compose up -d          # start everything
#    docker compose down           # stop + remove containers
#    docker compose down -v        # also wipe volumes
#    docker compose logs -f        # follow all logs
#    docker compose ps             # see running services
# =============================================================

version: "3.9"

# ── Services ──────────────────────────────────────────────────
services:

  # -----------------------------------------------------------
  # 1. Nginx  —  Reverse Proxy / Single Entry Point
  #    Receives all traffic on :80 and routes it:
  #      /api/*   → backend (Flask)
  #      /*       → frontend (React)
  # -----------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: ks_nginx
    ports:
      - "80:80"                        # Only port exposed to host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - frontend-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # -----------------------------------------------------------
  # 2. Frontend  —  React (served by Node dev server)
  #    Build from local Dockerfile inside ./frontend/
  # -----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ks_frontend
    environment:
      - REACT_APP_API_URL=http://localhost/api
    networks:
      - frontend-net
    restart: unless-stopped
    # Note: NOT exposed directly to host — Nginx proxies to it

  # -----------------------------------------------------------
  # 3. Backend  —  Flask REST API
  #    Connects to both Postgres (data) and Redis (cache)
  # -----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ks_backend
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://kanishk:secret123@db:5432/appdb
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=kanishk-super-secret-key
    depends_on:
      db:
        condition: service_healthy      # Wait for Postgres to pass healthcheck
      redis:
        condition: service_started
    networks:
      - frontend-net                   # Nginx can reach it
      - backend-net                    # DB + Redis live here
    volumes:
      - ./backend:/app                 # Mount code for live reload in dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------
  # 4. Database  —  PostgreSQL 15
  #    Data persisted in named volume "pg_data"
  # -----------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: ks_postgres
    environment:
      POSTGRES_USER: kanishk
      POSTGRES_PASSWORD: secret123      # Use Docker secrets in production!
      POSTGRES_DB: appdb
    volumes:
      - pg_data:/var/lib/postgresql/data   # Persistent storage
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanishk -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -----------------------------------------------------------
  # 5. Redis  —  In-Memory Cache / Session Store
  #    No data persistence needed (cache is ephemeral by design)
  # -----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ks_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - backend-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

# ── Named Volumes ─────────────────────────────────────────────
# Volumes persist data even after "docker compose down"
# Only "docker compose down -v" deletes them
volumes:
  pg_data:
    driver: local

# ── Networks ──────────────────────────────────────────────────
# Two isolated networks for security:
#   frontend-net → Nginx, Frontend, Backend can talk to each other
#   backend-net  → Backend, DB, Redis (DB hidden from Nginx/Frontend)
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
