# ===============================================
# Default config (used when running the app)
# ===============================================

# H2 in-memory DB — for the demo, we use H2 in both dev and test
spring.datasource.url=jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# External pricing service URL — overridden in WireMock tests
pricing.api.url=https://api.example.com

logging.level.org.springframework.web=INFO
